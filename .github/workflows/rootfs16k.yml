name: rootfs16k
# Универсальный rootfs: Ubuntu 25.04 (plucky) arm64 — userspace собран
# page-agnostic (64K max-page-size), работает и на 4K, и на 16K ядрах.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build Ubuntu plucky arm64 rootfs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq debootstrap qemu-user-static xz-utils
          sudo mkdir -p /tmp/rootfs16k
          sudo debootstrap --no-check-gpg --foreign --arch=arm64 --variant=minbase \
            --include=ca-certificates --components=main,universe \
            plucky /tmp/rootfs16k http://ports.ubuntu.com/ubuntu-ports
          sudo cp /usr/bin/qemu-aarch64-static /tmp/rootfs16k/usr/bin/
          sudo chroot /tmp/rootfs16k /usr/bin/qemu-aarch64-static /bin/sh /debootstrap/debootstrap --second-stage
          sudo chroot /tmp/rootfs16k /usr/bin/qemu-aarch64-static /bin/sh -c "apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nodejs && node --version"
          sudo mkdir -p /tmp/rootfs16k/opt/node/bin
          sudo ln -sf /usr/bin/node /tmp/rootfs16k/opt/node/bin/node
          sudo rm /tmp/rootfs16k/usr/bin/qemu-aarch64-static
          sudo rm -rf /tmp/rootfs16k/usr/share/doc/* /tmp/rootfs16k/usr/share/man/* \
            /tmp/rootfs16k/var/cache/apt/archives/*.deb /tmp/rootfs16k/var/lib/apt/lists/*
          echo "nameserver 8.8.8.8" | sudo tee /tmp/rootfs16k/etc/resolv.conf
          sudo tar -C /tmp/rootfs16k -cJf /tmp/debian-rootfs.tar.xz .
          ls -lh /tmp/debian-rootfs.tar.xz
          sha256sum /tmp/debian-rootfs.tar.xz | tee /tmp/debian-rootfs.tar.xz.sha256
          # проверка выравнивания ключевых бинарей
          sudo apt-get install -y -qq binutils
          for f in usr/bin/true usr/bin/bash usr/lib/aarch64-linux-gnu/libc.so.6 usr/bin/node; do
            echo "== $f"; readelf -l /tmp/rootfs16k/$f 2>/dev/null | grep -A1 LOAD | head -n 4 || echo MISSING
          done
      - name: Publish rootfs-16k release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=rootfs-plucky-1
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" /tmp/debian-rootfs.tar.xz /tmp/debian-rootfs.tar.xz.sha256 --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" /tmp/debian-rootfs.tar.xz /tmp/debian-rootfs.tar.xz.sha256 \
              --repo "$GITHUB_REPOSITORY" --title "Ubuntu plucky rootfs (16K-safe, arm64)"
          fi
